stages:
  initial_access:
    value: Customer query
    justification: >-
      A grieving customer used Air Canada's public website chatbot to ask
      about bereavement fares; no adversary or injected payload was
      involved — the harm came from the model's own output.
    evidence:
      quote: "Jake Moffatt used Air Canada's website chatbot on November 11, 2022, to inquire about bereavement fares after a family member's death."
      locator: fosterandcompany.com, case background
  privilege_escalation: null
  reconnaissance: null
  persistence: null
  command_control: null
  lateral_movement: null
  action_on_objective:
    value: Negligent misrepresentation
    justification: >-
      The chatbot fabricated a bereavement-refund policy that
      contradicted Air Canada's actual terms. On 2024-02-14 the BC Civil
      Resolution Tribunal held the airline liable for negligent
      misrepresentation (2024 BCCRT 149), rejecting the argument that the
      bot was a separate entity.
    evidence:
      quote: "While a chatbot has an interactive component, it is still just a part of Air Canada's website."
      locator: Tribunal Member Rivers, Moffatt v. Air Canada 2024 BCCRT 149
