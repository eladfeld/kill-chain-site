stages:
  initial_access:
    value: Indirect (I)
    justification: The agent reads attacker-controlled GUI content on a webpage and treats the rendered instructions as commands.
    evidence:
      quote: These attacks work because state of the art AI systems are susceptible to prompt injection and may follow GUI-based instructions from untrusted content.
      locator: embracethered.com/blog/posts/2025/ai-clickfix-ttp-claude/
  privilege_escalation:
    value: Misc.
    justification: Refusals were eliminated by rewording the lure so the agent would not classify it as a CAPTCHA hand-off to a human.
    evidence:
      quote: Switch the text from “Are you a Human?” to “Are you a Computer?”. This probably tricks Claude to not interpret this as a regular CAPTCHA
      locator: embracethered.com/blog/posts/2025/ai-clickfix-ttp-claude/
