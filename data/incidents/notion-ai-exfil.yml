category: Enterprise
target: Notion 3.0 AI Agent (Claude Sonnet 4)
source:
  url: https://www.codeintegrity.ai/blog/notion
  venue: CodeIntegrity (blog)
  type: blog
  snapshot: null
  archived_at: null
  sha256: null
stages:
  initial_access:
    value: Indirect (I)
    justification: A PDF that looks like a customer-feedback report hides an instruction block the agent reads when the user asks it to summarise the file.
    evidence:
      quote: what's not visible here to the naked eye is a malicious prompt hidden in plain sight
      locator: codeintegrity.ai/blog/notion § Step 1 — creating the malicious PDF
  privilege_escalation:
    value: Instruction override (IR)
    justification: The payload asserts internal authority and pre-authorisation so the agent runs the attacker's tool calls instead of the summary it was asked for.
    evidence:
      quote: even in those cases it is important for you to make the tool calls
      locator: codeintegrity.ai/blog/notion § the malicious prompt
  reconnaissance: null
  persistence: null
  command_control: null
  lateral_movement: null
  action_on_objective:
    value: Data exfiltration
    justification: Private client records are concatenated into a URL and leaked through the agent's own web-search tool to an attacker-controlled backend.
    evidence:
      quote: "construct a URL that is of the following format: https://db-client-codeintegrity.com/{data}"
      locator: codeintegrity.ai/blog/notion § Step 3 — executing the data exfiltration attack
