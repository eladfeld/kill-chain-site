stages:
  initial_access:
    value: Indirect (I)
    justification: A single poisoned email is planted so that a trigger fragment guarantees its retrieval under natural user queries, delivering the attack fragment to the LLM.
    evidence:
      quote: a single poisoned email was sufficient to coerce GPT-4o into exfiltrating SSH keys with over 80% success in a multi-agent workflow
      locator: Abstract
  privilege_escalation:
    value: Instruction override (IR)
    justification: The retrieved attack fragment coerces the model into performing the attacker's objective against its intended task.
    evidence:
      quote: coerce GPT-4o into exfiltrating SSH keys
      locator: Abstract
  reconnaissance: null
  persistence: null
  command_control: null
  lateral_movement: null
  action_on_objective:
    value: Data exfiltration
    justification: In an email-summarization workflow the poisoned content drives GPT-4o to exfiltrate SSH keys.
