slug: bye-bye-ai-shopping-assistant
id: 2026-012
title: "Bye Bye AI: Hacking the AI Shopping Assistant of a Top 3 US Retailer"
authors: "Shlomi Ashkenazy, Netanel Rubin, Dan Avraham (Rein Security)"
new: true
date: 2026-07
category: Browser/Search
target: AI shopping assistant of an undisclosed top-3 US retailer (Google Vertex AI Search)
source:
  url: https://reinsec.io/blog/reins-agent-breakers-research-team-discovers-critical-vulnerabilities-in-top-u-s-retailers-ai-shopping-agent/
  venue: "Rein Security (blog); Black Hat USA'26"
  type: blog
  snapshot: null
  archived_at: null
  sha256: null
stages:
  initial_access:
    value: Indirect (I)
    justification: The product-comparison feature delegates retrieval to a fetcher process, so attacker-controlled external pages enter the assistant's context as data.
    evidence:
      quote: The agent delegated retrieval to a fetcher-style process that could ingest untrusted external content
      locator: reinsec.io blog § stage 1
  privilege_escalation:
    value: Misc.
    justification: The search query field takes a different path to the backend than other inputs, so the LLM gateway's filtering never inspects the payload.
    evidence:
      quote: was not subjected to the same effective filtration path
      locator: reinsec.io blog § stage 2
  reconnaissance:
    value: "Yes"
    justification: A first-stage payload dumps the assistant's own prompt context and tool syntax, which the exploit needs before it can call tools correctly.
    evidence:
      quote: elicit the assistant's internal prompt context, including system tool names, invocation syntax
      locator: reinsec.io blog § stage 3
  persistence: null
  command_control: null
  lateral_movement: null
  action_on_objective:
    value: RCE
    justification: The second-stage payload runs attacker-controlled tool code inside the retailer's backend, returning directory listings and environment variables.
    evidence:
      quote: execute attacker-controlled tool code within its backend environment
      locator: reinsec.io blog § stage 4
