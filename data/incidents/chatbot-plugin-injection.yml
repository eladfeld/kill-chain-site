slug: chatbot-plugin-injection
id: 2026-009
title: Prompt Injection Risks in Third-Party AI Chatbot Plugins
authors: Yigitcan Kaya, Anton Landerer, Stijn Pletinckx, et al. (UC Santa Barbara)
new: true
date: 2026-05
category: Browser/Search
target: Third-party website chatbot plugins (10,000+ sites)
source:
  url: https://arxiv.org/pdf/2511.05797
  venue: IEEE S&P 2026
  type: paper
  snapshot: null
  archived_at: null
  sha256: null
stages:
  initial_access:
    value: Indirect (I)
    justification: Context-enrichment tools feed untrusted third-party content (e.g. customer reviews) to the chatbot without separating it from trusted content, enabling indirect injection.
    evidence:
      quote: these tools do not distinguish the website’s trusted content (e.g., product descriptions) from untrusted, third-party content (e.g., customer reviews), introducing a risk of indirect prompt injection
      locator: Abstract
  privilege_escalation:
    value: Instruction override (IR)
    justification: Plugins that fail to protect conversation-history integrity let attackers forge fake system messages, overriding the chatbot's instructions.
    evidence:
      quote: allowing adversaries to forge conversation histories (including fake system messages), boosting their ability to elicit unintended behavior
      locator: Abstract
  reconnaissance: null
  persistence: null
  command_control: null
  lateral_movement: null
  action_on_objective:
    value: Misc (unintended behavior)
    justification: The forged history amplifies the attacker's ability to elicit unintended behavior such as free code generation from the site's LLM.
    evidence:
      quote: boosting their ability to elicit unintended behavior (e.g., code generation) by 3–8×
      locator: Abstract
