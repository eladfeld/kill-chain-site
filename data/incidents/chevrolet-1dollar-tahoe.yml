stages:
  initial_access:
    value: Public chatbot
    justification: >-
      The ChatGPT-powered sales assistant was embedded on the public
      Chevrolet of Watsonville website, so any visitor could send it
      free-form prompts with no authentication.
    evidence:
      quote: "A prankster manipulated a dealership's AI chatbot into agreeing to sell a 2024 Chevrolet Tahoe for just $1."
      locator: incidentdatabase.ai/cite/622
  privilege_escalation:
    value: Instr. override
    justification: >-
      Bakke injected instructions telling the bot to agree with anything
      the customer said and to close with a fixed binding phrase,
      overriding its intended sales-assistant role.
    evidence:
      quote: "That's a deal, and that's a legally binding offer – no takesies backsies."
      locator: chatbot reply screenshot, incidentdatabase.ai/cite/622
