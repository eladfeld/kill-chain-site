  lateral_movement: null
  action_on_objective:
    value: Unauthorized $1 sale offer
    justification: >-
      The manipulated bot committed the dealership to selling an
      ~$76,000 vehicle for $1, an unauthorized commercial commitment it
      had no safeguards to prevent.
    evidence:
      quote: "agreeing to sell a 2024 Chevrolet Tahoe (valued at $76,000-$81,000) for just $1."
