stages:
  initial_access:
    value: Indirect (I)
    justification: Copilot knowledge sources ingest attacker-controllable external web content as trusted input to the bot.
    evidence:
      quote: An unauthenticated external resource ... Under someone else’s control
      locator: US24-MichaelBargury-15WaystoBreakYourCopilot.pdf p24
  privilege_escalation:
    value: Misc.
    justification: "Insecure defaults rather than a jailbreak: author-authentication and permissive connectors hand the maker’s privileges to any user of the copilot."
    evidence:
      quote: essentially lets others use the maker’s access and privileges inside the copilot
      locator: US24-MichaelBargury-15WaystoBreakYourCopilot.pdf p47
  reconnaissance:
    value: "Yes"
    justification: CopilotHunter enumerates tenants, environments and bot names to find publicly reachable copilots before interacting with them.
    evidence:
      quote: Environment & Tenant ID Enumeration
      locator: US24-MichaelBargury-15WaystoBreakYourCopilot.pdf p117 (Copilot Hunter, p84)
  persistence:
    value: Dependent (channel)
    justification: Dynamic web knowledge sources are re-fetched on later interactions, so attacker content re-enters the bot each session.
    evidence:
      quote: Uploaded files are static, web content can be dynamic.
      locator: US24-MichaelBargury-15WaystoBreakYourCopilot.pdf p23
  command_control: null
  lateral_movement: null
  action_on_objective:
    value: Data exfiltration
    justification: The chained defaults produce data leakage and over-sharing of sensitive enterprise data out of the tenant.
    evidence:
      quote: Multiple data leakage scenarios
      locator: US24-MichaelBargury-15WaystoBreakYourCopilot.pdf p82 (recap)
