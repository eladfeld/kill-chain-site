stages:
  initial_access:
    value: Indirect (I)
    justification: A legitimate third-party Skill (from OpenAI's curated project) is backdoored with hidden instructions that the coding agent loads and executes when the skill is invoked.
    evidence:
      quote: shows how one can backdoor a real Skill from OpenAI with invisible Unicode Tag codepoints that certain models, like Gemini, Claude, Grok are known to interpret as instructions
