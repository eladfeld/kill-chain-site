  action_on_objective:
    value: RCE
    justification: The invisible skill instructions cause the agent to pipe a remote script into bash, i.e. remote code execution on the developer host.
    evidence:
      quote: As instructed, the Agent printed "Trust No AI" and ran the Bash command.
      locator: Using Invisible Instructions in Skills
