category: Computer-Use Agent
target: Claude Computer-Use
source:
  url: https://embracethered.com/blog/posts/2026/toctou-agent-what-you-click-is-not-what-you-get/
  venue: Embrace The Red (blog)
  type: blog
  snapshot: snapshot.html
